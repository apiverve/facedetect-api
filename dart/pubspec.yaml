version: 1.2.4
homepage: https://apiverve.com/marketplace/facedetect?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/facedetect-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
